global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"
  
scrape_configs:
  - job_name: 'ml-api'
    scrape_interval: 5s
    static_configs:
      - targets: ['ml-app:6060']

  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'model-training' 
    scrape_interval: 3s
    static_configs:
      - targets:
        - 'training-metrics:8002'
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 2s
